<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>年代相机 EraCam</title>
<meta name="theme-color" content="#1c1a17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ink:#141414;--bg:#ece8df;--panel:#fff;--red:#c8361d;--black:#1c1a17}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}html.fs2{font-size:19px}html.fs3{font-size:21px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-weight:500;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:calc(env(safe-area-inset-top) + .45rem) .75rem .45rem;background:var(--black);color:#fff}
header svg{flex:none}
header h1{font-size:1.15rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.hbtn{min-width:3.1rem;height:2.5rem;padding:0 .5rem;border:2px solid #fff;background:transparent;color:#fff;border-radius:8px;font-weight:800;white-space:nowrap}
main{max-width:540px;margin:0 auto;padding:.6rem .75rem calc(env(safe-area-inset-bottom) + 1.2rem)}
section.view{display:none}section.view.on{display:block}
/* viewfinder */
.vf{position:relative;margin:0 auto;width:min(100%,41vh);aspect-ratio:3/4;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px var(--black)}
.vf canvas{display:block;width:100%;height:100%}
#video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
.vf .badge{position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.72);color:#fff;font-weight:800;padding:.15rem .5rem;border-radius:6px;font-variant-numeric:tabular-nums}
.vf .recinfo{position:absolute;top:.5rem;left:.5rem;background:rgba(0,0,0,.72);color:#fff;font-weight:800;padding:.15rem .5rem;border-radius:6px;display:none;font-variant-numeric:tabular-nums}
.vf .recinfo b{color:#ff4a32}
.vf.rec .recinfo{display:block}
.vf .bar{position:absolute;left:0;bottom:0;height:6px;width:0;background:#ff3b22;display:none}
.vf.rec .bar{display:block}
.vf .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.vf .flash.go{opacity:.85;transition:none}
.startbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.2rem;background:#1c1a17;color:#fff;text-align:center}
.startbox button{min-height:3.4rem;padding:0 1.4rem;border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:.6rem}
.startbox p{margin:0;font-size:1rem;font-weight:600;color:#fff;max-width:22rem}
.startbox .err{background:#fff;color:var(--ink);border-left:6px solid var(--red);padding:.6rem .8rem;border-radius:6px;text-align:left}
/* controls */
h2{font-size:1rem;font-weight:800;margin:.85rem 0 .35rem}
.seg{display:grid;gap:.35rem}
.seg button{min-height:2.9rem;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:6px;font-weight:800;padding:0 .2rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{opacity:.45}
.mode{grid-template-columns:1fr 1fr;margin-top:.8rem}
.eras{grid-template-columns:repeat(5,1fr)}
.degs{grid-template-columns:repeat(10,1fr);gap:.25rem}
.degs button{padding:0;font-variant-numeric:tabular-nums}
.toggles{grid-template-columns:1fr 1fr;margin-top:.8rem}
.desc{margin:.45rem 0 0;font-weight:600}
.shutterrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:1rem}
.albumbtn{justify-self:start;width:4rem;height:4rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel) center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center}
.albumbtn .cnt{position:absolute;top:-.55rem;right:-.55rem;min-width:1.6rem;height:1.6rem;border-radius:.8rem;background:var(--red);color:#fff;font-size:.85rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 .3rem}
.flipbtn{justify-self:end;width:4rem;height:4rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);display:flex;align-items:center;justify-content:center}
.shutter{width:5.2rem;height:5.2rem;border-radius:50%;border:5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.shutter i{display:block;width:3.7rem;height:3.7rem;border-radius:50%;background:var(--ink);transition:all .15s}
.shutter.cine i{background:var(--red)}
.shutter.cine.recording i{width:2rem;height:2rem;border-radius:6px}
.shutter:disabled{opacity:.4}
.note{margin:.9rem 0 0;font-weight:600;background:var(--panel);border-left:6px solid var(--ink);padding:.55rem .75rem;border-radius:6px}
/* album */
.topbar{display:flex;align-items:center;gap:.6rem;margin:.2rem 0 .7rem}
.topbar h2{margin:0;font-size:1.2rem;flex:1}
.back{min-height:2.8rem;padding:0 .9rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);font-weight:800;display:flex;align-items:center;gap:.35rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.tile{position:relative;aspect-ratio:3/4;border:0;padding:0;border-radius:6px;overflow:hidden;background:#000 center/cover no-repeat}
.tile span{position:absolute;bottom:.3rem;background:rgba(0,0,0,.75);color:#fff;font-size:.85rem;font-weight:800;padding:.05rem .35rem;border-radius:4px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:.2rem}
.tile .e{left:.3rem}.tile .d{right:.3rem}
.empty{font-weight:600;background:var(--panel);padding:1rem;border-radius:8px}
.media{display:block;width:100%;max-height:62vh;object-fit:contain;background:#000;border-radius:8px}
.info{font-weight:700;margin:.6rem 0}
.actions{display:grid;gap:.5rem}
.big{min-height:3.3rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);font-weight:800;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:0 .8rem;text-align:center}
.big.primary{background:var(--ink);color:#fff}
.big.danger{border-color:var(--red);color:var(--red)}
/* card maker */
.settings{background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:.2rem .8rem .9rem}
.settings h2{margin-top:.7rem}
.frames{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem}
.frames button{flex:none;width:4.2rem;aspect-ratio:3/4;border:3px solid transparent;border-radius:6px;padding:0;background:#000 center/cover no-repeat;position:relative}
.frames button.on{border-color:var(--red)}
.frames button span{position:absolute;bottom:.15rem;left:.15rem;background:rgba(0,0,0,.75);color:#fff;font-size:.8rem;font-weight:800;padding:0 .25rem;border-radius:3px}
.txt{width:100%;min-height:3rem;border:2px solid var(--ink);border-radius:6px;padding:.4rem .6rem;background:#fff;font-weight:600}
.help{margin:.4rem 0 0;font-weight:600}
#cardPrev{display:block;width:100%;margin:.8rem 0;border-radius:6px}
/* language picker */
#lang{position:fixed;inset:0;z-index:50;background:var(--black);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:2rem}
#lang.on{display:flex}
#lang .t{font-size:1.5rem;font-weight:800;text-align:center;line-height:1.35}
#lang button{width:min(18rem,80vw);min-height:3.6rem;border:0;border-radius:10px;background:#fff;color:var(--ink);font-size:1.25rem;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 1.2rem);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:.7rem 1.1rem;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ver{margin-top:1rem;font-weight:600}
</style>
</head>
<body>
<div id="lang">
  <svg width="96" height="96" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon"/></svg>
  <div class="t">年代相机<br>EraCam<br>Kamera Era</div>
  <button data-l="zh">中文</button>
  <button data-l="en">English</button>
  <button data-l="ms">Malay</button>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="110" fill="#c8361d"/>
      <circle cx="256" cy="256" r="200" fill="#e0572a"/>
      <path d="M196 330h70l-20 118h-56z" fill="#1c1a17"/>
      <rect x="150" y="150" width="232" height="200" rx="26" fill="#2a2724"/>
      <rect x="150" y="150" width="232" height="46" rx="20" fill="#cfc9bd"/>
      <rect x="66" y="196" width="96" height="112" rx="14" fill="#1c1a17"/>
      <rect x="44" y="208" width="34" height="88" rx="10" fill="#3c3833"/>
      <circle cx="61" cy="252" r="22" fill="#6fa6c9"/><circle cx="55" cy="244" r="7" fill="#d9eef8"/>
      <circle cx="296" cy="262" r="58" fill="#cfc9bd"/>
      <circle cx="296" cy="262" r="44" fill="#1c1a17"/>
      <g stroke="#f2b33d" stroke-width="7" stroke-linecap="round"><path d="M296 222v12"/><path d="M336 262h-12"/><path d="M296 302v-12"/><path d="M256 262h12"/></g>
      <path d="M296 262l26-20" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <rect x="352" y="110" width="44" height="58" rx="8" fill="#1c1a17"/>
    </symbol>
    <symbol id="i-cine" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></symbol>
    <symbol id="i-still" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6M18 3v4h-4M6 21v-4h4"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 5l12 7-12 7z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-off" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
  </defs>
</svg>

<header>
  <svg width="34" height="34" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon"/></svg>
  <h1 id="title">年代相机</h1>
  <button class="hbtn" id="fsBtn" aria-label="Text size">Aa</button>
  <button class="hbtn" id="langBtn">中文</button>
</header>

<main>
<!-- CAMERA -->
<section class="view on" id="vCam">
  <div class="vf" id="vf">
    <canvas id="out" width="720" height="960"></canvas>
    <video id="video" playsinline muted autoplay></video>
    <div class="badge" id="badge">1960 · 6</div>
    <div class="recinfo" id="recinfo"><b>●</b> <span id="rectime">0:00</span> / 0:15</div>
    <div class="bar" id="bar"></div>
    <div class="flash" id="flash"></div>
    <div class="startbox" id="startbox">
      <button id="startBtn"><svg width="26" height="26"><use href="#i-cam"/></svg><span data-i="start"></span></button>
      <p id="startMsg"></p>
    </div>
  </div>

  <div class="seg mode">
    <button id="mCine"><svg width="24" height="24"><use href="#i-cine"/></svg><span data-i="cine"></span></button>
    <button id="mStill"><svg width="24" height="24"><use href="#i-still"/></svg><span data-i="still"></span></button>
  </div>

  <h2 data-i="era"></h2>
  <div class="seg eras" id="eras"></div>
  <p class="desc" id="eraDesc"></p>

  <h2 data-i="degree"></h2>
  <div class="seg degs" id="degs"></div>

  <div class="seg toggles">
    <button id="tFx"><svg width="20" height="20" class="ic"><use href="#i-check"/></svg><span data-i="frameFx"></span></button>
    <button id="tSnd"><svg width="20" height="20" class="ic"><use href="#i-check"/></svg><span data-i="soundFx"></span></button>
  </div>

  <div class="shutterrow">
    <button class="albumbtn" id="albumBtn" aria-label="Album"><span class="cnt" id="albumCnt" hidden>0</span></button>
    <button class="shutter" id="shutter" aria-label="Shutter" disabled><i></i></button>
    <button class="flipbtn" id="flipBtn" aria-label="Flip camera"><svg width="30" height="30"><use href="#i-flip"/></svg></button>
  </div>
  <p class="note" id="camNote" hidden></p>
</section>

<!-- ALBUM -->
<section class="view" id="vAlbum">
  <div class="topbar">
    <button class="back" data-go="vCam"><svg width="20" height="20"><use href="#i-back"/></svg><span data-i="back"></span></button>
    <h2 data-i="album"></h2>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" data-i="noItems" hidden></p>
  <p class="note" data-i="storageNote"></p>
  <p class="ver" id="ver"></p>
</section>

<!-- VIEWER -->
<section class="view" id="vView">
  <div class="topbar">
    <button class="back" data-go="vAlbum"><svg width="20" height="20"><use href="#i-back"/></svg><span data-i="back"></span></button>
    <h2 id="viewTitle"></h2>
  </div>
  <div id="mediaBox"></div>
  <p class="info" id="viewInfo"></p>
  <div class="actions">
    <button class="big primary" id="shareBtn" data-i="share"></button>
    <button class="big" id="cardBtn" data-i="makeCard"></button>
    <button class="big danger" id="delBtn" data-i="del"></button>
  </div>
</section>

<!-- CARD MAKER -->
<section class="view" id="vCard">
  <div class="topbar">
    <button class="back" data-go="vView"><svg width="20" height="20"><use href="#i-back"/></svg><span data-i="back"></span></button>
    <h2 data-i="makeCard"></h2>
  </div>
  <div class="settings">
    <div id="frameWrap">
      <h2 data-i="pickFrame"></h2>
      <div class="frames" id="frames"></div>
    </div>
    <h2 data-i="caption"></h2>
    <input class="txt" id="capIn" maxlength="40" autocomplete="off">
    <h2 data-i="qrLink"></h2>
    <input class="txt" id="qrIn" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="help" data-i="qrHelp"></p>
  </div>
  <canvas id="cardPrev" width="950" height="1430"></canvas>
  <div class="actions">
    <button class="big primary" id="shareCardBtn" data-i="shareCard"></button>
    <button class="big" id="printBtn" data-i="printImg"></button>
  </div>
  <p class="note" data-i="printNote"></p>
</section>
</main>
<div class="toast" id="toast"></div>

    if(ch==="'")ctx.fillRect(cx,0,th*.9,hgt*.3);
    const s=SEG[ch];
    if(s){const P={a:[cx+th*.5,0,wd-th,th],g:[cx+th*.5,hh-th/2,wd-th,th],d:[cx+th*.5,hgt-th,wd-th,th],
      f:[cx,th*.5,th,hh-th*.75],b:[cx+wd-th,th*.5,th,hh-th*.75],e:[cx,hh+th*.25,th,hh-th*.75],c:[cx+wd-th,hh+th*.25,th,hh-th*.75]};

}

1940:{hp:150,lp:5000,drive:.15,wow:.0006,wr:.7,hiss:.02,crk:.03,motor:.02,hum:0},

const AUD={
  init(){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ac=this.ac=new AC(),sr=ac.sampleRate;
    this.dest=ac.createMediaStreamDestination();
    const master=ac.createGain();master.connect(this.dest);
    const hp=this.hp=ac.createBiquadFilter();hp.type='highpass';
    const lp=this.lp=ac.createBiquadFilter();lp.type='lowpass';
    const ws=this.ws=ac.createWaveShaper();ws.oversample='2x';
    const dl=ac.createDelay(.05);dl.delayTime.value=.006;
    const lfo=ac.createOscillator();this.lfo=lfo;const lg=this.lg=ac.createGain();lg.gain.value=0;lfo.connect(lg);lg.connect(dl.delayTime);lfo.start();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-24;comp.ratio.value=3;
    hp.connect(lp);lp.connect(ws);ws.connect(dl);dl.connect(comp);comp.connect(master);
    const buf=(sec,fn)=>{const b=ac.createBuffer(1,Math.floor(sr*sec),sr),d=b.getChannelData(0);fn(d,sr);return b};
    const loop=(b,g)=>{const s=ac.createBufferSource();s.buffer=b;s.loop=true;s.connect(g);s.start();return s};
    const mk=()=>{const g=ac.createGain();g.gain.value=0;g.connect(master);return g};
    this.hissG=mk();const hf=ac.createBiquadFilter();hf.type='highpass';hf.frequency.value=1800;hf.connect(this.hissG);
    loop(buf(2,d=>{for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}),hf);
    this.crkG=mk();loop(buf(3,(d,sr)=>{for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.04;
      for(let k=0;k<26;k++){const p=Math.floor(Math.random()*(d.length-80)),a=(Math.random()*.8+.2)*(Math.random()<.5?-1:1);for(let j=0;j<60;j++)d[p+j]+=a*Math.exp(-j/9)}}),this.crkG);
    this.motG=mk();loop(buf(1,(d,sr)=>{for(let i=0;i<d.length;i++){const tt=i/sr,m=.6+.4*Math.sin(2*Math.PI*18*tt);
      d[i]=(.5*Math.sin(2*Math.PI*90*tt)+.25*Math.sin(2*Math.PI*180*tt)+.15*Math.sin(2*Math.PI*270*tt))*m*.6;
      const ph=(tt*18)%1;if(ph<.012)d[i]+=(Math.random()*2-1)*.9*(1-ph/.012)}}),this.motG);
    this.humG=mk();[50,150].forEach((f,k)=>{const o=ac.createOscillator();o.frequency.value=f;const g=ac.createGain();g.gain.value=k?.35:1;o.connect(g);g.connect(this.humG);o.start()});
  },
  setSource(stream){
    if(!this.ac)return;

    if(stream&&stream.getAudioTracks().length){this.src=this.ac.createMediaStreamSource(stream);this.src.connect(this.hp)}
  },
  set(era,deg,on){
    if(!this.ac)return;const s=on?degS(deg):0,p=SND[era],n=this.ac.currentTime,tc=.05;
    const lg=Math.exp(L_(Math.log(18000),Math.log(p.lp),s));
    this.hp.frequency.setTargetAtTime(L_(20,p.hp,s),n,tc);this.lp.frequency.setTargetAtTime(lg,n,tc);

    this.hissG.gain.setTargetAtTime(p.hiss*s,n,tc);this.crkG.gain.setTargetAtTime(p.crk*s*2.5,n,tc);

function qrDraw(ctx,x,y,size,text){
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),qz=2,cell=Math.floor(size/(n+qz*2)),s=cell*(n+qz*2);
  const ox=Math.round(x+(size-s)/2),oy=Math.round(y+(size-s)/2);ctx.fillStyle='#fff';ctx.fillRect(x,y,size,size);ctx.fillStyle='#000';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(ox+(c+qz)*cell,oy+(r+qz)*cell,cell,cell);
}
const qrText=()=>$('qrIn').value.trim();
function coverDraw(ctx,img,x,y,w,h){const ia=img.width/img.height,ta=w/h;let sw=img.width,sh=img.height,sx=0,sy=0;
  if(ia>ta){sw=img.height*ta;sx=(img.width-sw)/2}else{sh=img.width/ta;sy=(img.height-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}
function drawCard(){
  if(!cardSrc)return;const c=$('cardPrev'),x=c.getContext('2d'),it=curItem;
  x.fillStyle='#d9d4c8';x.fillRect(0,0,950,1430);
  const M=70,cw=810,ch=1290;
  x.save();x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=28;x.shadowOffsetY=8;x.fillStyle='#fbf9f4';rr(x,M,M,cw,ch,30);x.fill();x.restore();
  coverDraw(x,cardSrc,M+60,M+90,690,930);
  x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=2;x.strokeRect(M+60,M+90,690,930);
  const by=M+1020,link=qrText();
  if(link){try{qrDraw(x,M+cw-60-210,by+30,210,link)}catch(e){}}
  const cap=$('capIn').value.trim();x.fillStyle='#1d1d1d';x.textBaseline='alphabetic';
  if(cap){x.font='600 60px "Segoe Print","Bradley Hand","Marker Felt","Comic Sans MS","Kaiti SC","STKaiti","KaiTi",cursive';fitText(x,cap,M+60,by+125,link?470:690)}
  x.font='700 34px "Courier New",monospace';x.fillStyle='#55504a';x.fillText(`${it.era} · ${it.deg}`,M+60,by+200);
}
function fitText(x,s,px,py,maxW){let fs=60;while(fs>28&&x.measureText(s).width>maxW){fs-=4;x.font=x.font.replace(/\d+px/,fs+'px')}x.fillText(s,px,py)}
function buildPrint(){
  const img=cardSrc,w=img.width,h=img.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0);
  const link=qrText();if(link){const s=Math.round(w*.33),m=Math.round(w*.04);x.fillStyle='#fff';rr(x,w-s-m-8,h-s-m-8,s+16,s+16,10);x.fill();try{qrDraw(x,w-s-m,h-s-m,s,link)}catch(e){}}
  return c;
}
$('shareCardBtn').onclick=async()=>{drawCard();const b=await new Promise(r=>$('cardPrev').toBlob(r,'image/jpeg',.92));saveOrShare(b,fileName(curItem,'_card','jpg'))};
$('printBtn').onclick=async()=>{const c=buildPrint();const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));saveOrShare(b,fileName(curItem,'_print','jpg'))};
