<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>年代相机 EraCam</title>
<meta name="theme-color" content="#1c1a17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ink:#141414;--bg:#ece8df;--panel:#fff;--red:#e20612;--black:#1c1a17}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;touch-action:manipulation}
html{font-size:17px}html.fs2{font-size:19px}html.fs3{font-size:21px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-weight:500;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:calc(env(safe-area-inset-top) + .45rem) .75rem .45rem;background:var(--black);color:#fff}
header svg{flex:none}
header h1{font-size:1.15rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.hbtn{min-width:3.1rem;height:2.5rem;padding:0 .5rem;border:2px solid #fff;background:transparent;color:#fff;border-radius:8px;font-weight:800;white-space:nowrap}
main{max-width:540px;margin:0 auto;padding:env(safe-area-inset-top) .75rem calc(env(safe-area-inset-bottom) + .6rem)}
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#000;z-index:20}
section.view{display:none}section.view.on{display:block}
section.view.fit.on{display:flex;flex-direction:column;height:calc(100vh - var(--chrome,0px));height:var(--avail,calc(100dvh - var(--chrome,0px)));min-height:20rem}
#vhProbe{position:fixed;top:0;bottom:0;left:0;width:0;visibility:hidden;pointer-events:none}
.fit.on>*{flex:none}.fit.on>.grow{flex:1 1 0;min-height:9rem}
.vfwrap{display:flex;justify-content:center;align-items:center;margin:0 -.75rem;background:#000}
/* viewfinder */
.vf{position:relative;margin:0 auto;width:min(100%,20rem);aspect-ratio:3/4;flex:none;background:#000;overflow:hidden}
.vf canvas{display:block;width:100%;height:100%}
#video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
.vf .badge{position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.72);color:#fff;font-weight:800;padding:.15rem .5rem;border-radius:6px;font-variant-numeric:tabular-nums}
.vf .recinfo{position:absolute;top:.5rem;left:.5rem;background:rgba(0,0,0,.72);color:#fff;font-weight:800;padding:.15rem .5rem;border-radius:6px;display:none;font-variant-numeric:tabular-nums}
.vf .recinfo b{color:#ff4a32}
.vf.rec .recinfo{display:block}
.vf .hist{position:absolute;left:.5rem;bottom:.9rem;width:6rem;height:2.25rem;border-radius:4px;pointer-events:none;z-index:3}
.vf .vuwrap{position:absolute;right:.6rem;bottom:.9rem;width:5.5rem;height:6px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden;z-index:3}
.vf .vu{display:block;height:100%;width:0;background:#fff;transition:width .08s}.vf .vu.hot{background:var(--red)}
.vf .bar{position:absolute;left:0;bottom:0;height:6px;width:0;background:#ff3b22;display:none}
.vf.rec .bar{display:block}
.vfwait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.1rem;pointer-events:none}
.vfwait.dev{background:rgba(0,0,0,.35)}
.gridov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.gridov line{vector-effect:non-scaling-stroke}
.gridov .sh{stroke:rgba(0,0,0,.35);stroke-width:2.5}
.gridov .ln{stroke:rgba(255,255,255,.75);stroke-width:1}
.level{position:absolute;left:50%;top:50%;width:46%;height:0;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
/* one thin Leica-red line: tilts with the phone, snaps straight and brightens when level */
.level i{position:absolute;top:-0.75px;height:1.5px;background:var(--red);box-shadow:0 0 2px rgba(0,0,0,.7);opacity:.75}
.level .lv-side{display:none}
.level .lv-bar{left:0;width:100%;transform-origin:50% 50%}
.level.ok i{opacity:1;height:2px;top:-1px}
.vf .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.vf .flash.go{opacity:.85;transition:none}
.startbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.2rem;background:#1c1a17;color:#fff;text-align:center}
.startbox button:disabled{opacity:.75}
.startbox button{min-height:3.4rem;padding:0 1.4rem;white-space:nowrap;border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:.6rem}
.startbox p{margin:0;font-size:1rem;font-weight:600;color:#fff;max-width:22rem}
.startbox .err{background:#fff;color:var(--ink);border-left:6px solid var(--red);padding:.6rem .8rem;border-radius:6px;text-align:left}
/* controls */
h2{font-size:1rem;font-weight:800;margin:.85rem 0 .35rem}
.seg{display:grid;gap:.35rem}
.seg button{min-height:2.9rem;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:6px;font-weight:800;padding:0 .2rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{opacity:.45}
.eras{grid-template-columns:repeat(5,1fr)}
.degs{grid-template-columns:repeat(10,1fr);gap:.25rem}
.degs button{padding:0;font-variant-numeric:tabular-nums}
.toggles{grid-template-columns:1fr 1fr;margin-top:.75rem}
.erasum{width:100%;margin-top:.5rem;min-height:3.4rem;display:flex;align-items:center;gap:.7rem;padding:.4rem .75rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);text-align:left}
.erasum .es-val{flex:none;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;border-radius:6px;padding:.1rem .5rem}
.erasum .chev{flex:none}
.erasum .es-deg{flex:none;font-size:1.15rem;font-weight:800;white-space:nowrap}
.erasum .es-sp{flex:1}
/* settings screen: full-screen, light, own title bar with close button */
.cfg{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.cfgbar{flex:none;display:flex;align-items:center;gap:.6rem;padding:calc(env(safe-area-inset-top) + .45rem) .75rem .45rem;background:var(--black);color:#fff}
.cfgbar h2{flex:1;margin:0;font-size:1.15rem;font-weight:800}
.cfgclose{width:2.9rem;height:2.9rem;border:2px solid #fff;border-radius:8px;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.cfgbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:540px;margin:0 auto;padding:.3rem .75rem calc(env(safe-area-inset-bottom) + 1rem)}
.cfgbody h2{margin:.9rem 0 .4rem}
.eraguide{margin:0;padding-left:1.4rem;font-weight:600}
.eraguide li{margin:.35rem 0}.eraguide b{font-variant-numeric:tabular-nums}.eraguide li.cur{color:var(--red)}
.cfgdesc{margin:.5rem 0 0;font-weight:600;background:var(--panel);border-left:6px solid var(--ink);border-radius:6px;padding:.5rem .7rem}
.cfg .toggles{margin-top:1.1rem}
.vqs{gap:.3rem}
.sublabel{margin:.55rem 0 .3rem;font-weight:800}
.shutopts{grid-template-columns:repeat(4,1fr)}
.shutopts5{grid-template-columns:repeat(5,1fr)}
.shutopts5 button{padding:0 .1rem;white-space:nowrap}
.grids{grid-template-columns:repeat(5,1fr)}
.grids button{min-height:3.6rem;padding:.3rem 0}
.grids svg{width:2.1rem;height:2.1rem}
.lvrow{grid-template-columns:1fr 1fr;margin-top:.5rem}
.fpsopts{grid-template-columns:repeat(4,1fr)}
.fpsopts small{font-size:.75em;font-weight:700;margin-left:.15em}
.cfgdesc.warn{border-left-color:var(--red);color:#9e2412}
.fsopts{grid-template-columns:repeat(3,1fr)}
.langopts{grid-template-columns:repeat(4,1fr)}
.langopts button{padding:0 .1rem;white-space:nowrap}
.fsopts button{min-height:3.2rem;font-weight:800}
.vqs button{padding:0 .1rem;white-space:nowrap}
.ratios{grid-template-columns:repeat(5,minmax(0,1fr));gap:.3rem}
.ratios button{flex-direction:column;gap:.3rem!important;min-height:4.3rem!important;padding:.35rem 0!important;font-variant-numeric:tabular-nums}
.ratios .shp{flex:none;border:3px solid currentColor;border-radius:2px}
.erasum .es-ratio{flex:none;font-size:1.05rem;font-weight:800;border:2px solid var(--ink);border-radius:6px;padding:.05rem .35rem;font-variant-numeric:tabular-nums}
.cam,body.cam{background:#000}
/* camera screen: dark like a real camera, plain chips instead of outlined boxes */
.ctlrow{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.55rem;min-height:2.6rem}
.chip{height:2.6rem;min-width:2.6rem;padding:0 .7rem;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.on{background:#fff;color:#111}
.chip:disabled{opacity:.35}
.lenses{display:flex;gap:.35rem;flex:1 1 auto;justify-content:flex-start;min-width:0}
.lenses .chip{padding:0 .55rem;min-width:2.9rem}
.evchip{flex:none;margin-left:auto}
/* EV and timer share one fixed width so they line up as a column on the right */
#evChip,#timerChip{box-sizing:border-box;width:6.4rem;min-width:6.4rem;padding:0 .4rem;justify-content:center}
.evedit #evLock.on{background:var(--red);color:#fff}
.evchip.set,.evedit .evv.set{background:var(--red);color:#fff}  /* Leica red */
.evedit{display:flex;gap:.4rem;flex:1;justify-content:center}
.evedit .evv{min-width:5.2rem}
.moderow{display:flex;align-items:center;gap:.5rem;margin-top:.45rem}
.cfgwrap{flex:none;display:flex}
.moderow .tabs{flex:1;min-width:0}
.moderow .tab{flex:1;justify-content:center}
.tabs{display:flex;height:2.6rem;padding:3px;gap:3px;border:2px solid rgba(255,255,255,.4);border-radius:10px;box-sizing:border-box}
.tab{background:none;border:0;border-radius:7px;color:rgba(255,255,255,.75);font-weight:800;font-size:1.02rem;padding:0 .8rem;letter-spacing:.04em;white-space:nowrap;display:flex;align-items:center;gap:.35rem}
.tab.on{background:var(--red);color:#fff}  /* Leica red */
.tab:disabled{opacity:.4}
.cfgchip{border:2px solid rgba(255,255,255,.4);background:none}
#vCam .albumbtn{border:2px solid rgba(255,255,255,.55);background-color:#222}
#vCam .flipbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%}
#vCam .shutter{border-color:#fff;background:#000}
#vCam .shutter i{background:#fff}
#vCam .shutter.cine i{background:var(--red)}
#vCam .shutter:disabled{opacity:.5}
.shutter{position:relative}
.shlbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#111;font-weight:800;font-size:.9rem;pointer-events:none}
.qd{position:fixed;left:0;right:0;top:env(safe-area-inset-top);z-index:25;max-width:540px;margin:0 auto;color:#fff;touch-action:pan-x}
.qd-body{max-height:0;overflow:hidden;transition:max-height .25s ease;background:rgba(12,12,12,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.qd.open .qd-body{max-height:var(--qdMax,52vh);overflow-y:auto;touch-action:pan-y}
.qd-in{padding:.4rem .75rem .4rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.3rem .5rem;align-items:center}
.qrow-l{font-weight:800;font-size:.8rem;line-height:1.1;color:rgba(255,255,255,.72);max-width:4.2rem}
/* every option visible: wrapping grids, never sideways scrolling */
.qrow{display:grid;gap:.25rem}
.qrow .chip{min-width:0;width:100%;height:2.3rem;padding:0 .15rem;font-size:.92rem;overflow:hidden}
.qrow .chip svg{width:1.3rem;height:1.3rem;flex:none}
.qslide{display:flex;align-items:center;gap:.6rem;height:2.5rem}
.qtrack{--p:0;--k:1.75rem;position:relative;flex:1;height:var(--k);touch-action:none;cursor:pointer;outline:none}
.qtrack::before{content:'';position:absolute;left:calc(var(--k)/2);right:calc(var(--k)/2);top:50%;height:6px;margin-top:-3px;border-radius:3px;background:rgba(255,255,255,.22)}
.qfill{position:absolute;left:calc(var(--k)/2);top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--red);width:calc((100% - var(--k))*var(--p))}
.qticks{position:absolute;left:calc(var(--k)/2);right:calc(var(--k)/2);top:50%;display:flex;justify-content:space-between;transform:translateY(7px)}
.qticks b{width:2px;height:5px;border-radius:1px;background:rgba(255,255,255,.4)}
.qthumb{position:absolute;top:0;left:calc((100% - var(--k))*var(--p));width:var(--k);height:var(--k);border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .1s}
.qtrack.drag .qthumb{transform:scale(1.12)}
.qtrack:focus-visible .qthumb{outline:3px solid var(--red);outline-offset:2px}
.qval{flex:none;min-width:2.7rem;height:2.1rem;padding:0 .45rem;border-radius:8px;background:#fff;color:#111;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.qslide.era .qval{min-width:3.9rem}
.qg-qAid{grid-template-columns:repeat(3,minmax(0,1fr))}
.qg-shape,.qg-qNd,.qg-qGrid,.qg-qWb{grid-template-columns:repeat(5,minmax(0,1fr))}
.qg-degree{grid-template-columns:repeat(10,minmax(0,1fr));gap:.2rem}
.qg-qFps,.qg-qAng{grid-template-columns:repeat(4,minmax(0,1fr))}
.qg-qQual{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.qg-tog{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr))}
.qg-qSys{grid-template-columns:repeat(4,minmax(0,1fr))}
.qg-shape .chip{flex-direction:column;height:3rem;gap:.1rem}
.qrow .chip .shp{flex:none;border:2.5px solid currentColor;border-radius:2px}
.qd-handle{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:2.5rem;border:0;background:rgba(0,0,0,.5);color:#fff;font-weight:800;font-size:.95rem;padding:0 .75rem;font-variant-numeric:tabular-nums}
.qd.open .qd-handle{background:rgba(12,12,12,.86)}
.qd-handle .chev{flex:none;transition:transform .2s}
.qd-torch{position:absolute;right:.35rem;bottom:.15rem;width:2.5rem;height:2.5rem;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.qd-torch.on{background:var(--red)}
.qd-torch.on svg path{fill:currentColor}
.qd-torch.on .slash{display:none}   /* off = bolt with a slash through it; on = solid bolt on red */
.qd-torch:disabled{opacity:.35}
.qd{display:flex;flex-direction:column}
.qd-handle{padding-right:3rem!important;padding-left:3rem!important}
.qd.open .qd-handle .chev{transform:rotate(180deg)}
.qd-more{display:flex;justify-content:center;padding:.1rem .75rem .6rem}
.qd-more .chip{min-width:60%}
.cdov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4}
.cdov b{font-size:6rem;font-weight:800;color:#fff;text-shadow:0 0 18px rgba(0,0,0,.7);font-variant-numeric:tabular-nums;transition:transform .12s}
.cdov.lit{box-shadow:inset 0 0 0 6px var(--red),inset 0 0 60px rgba(226,6,18,.55)}
.cdov.lit b{transform:scale(1.08)}
.scrflash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70;transition:opacity .06s}
.scrflash.on{opacity:.85}
#timerChip.set{background:var(--red);color:#fff;border-color:var(--red)}
.shutterrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:.5rem}
.albumbtn{justify-self:start;width:3.5rem;height:3.5rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel) center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center}
.albumbtn .cnt{position:absolute;top:-.55rem;right:-.55rem;min-width:1.6rem;height:1.6rem;border-radius:.8rem;background:var(--red);color:#fff;font-size:.85rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 .3rem}
.flipbtn{justify-self:end;width:3.5rem;height:3.5rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);display:flex;align-items:center;justify-content:center}
.shutter{width:4.6rem;height:4.6rem;border-radius:50%;border:5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.shutter i{display:block;width:3.25rem;height:3.25rem;border-radius:50%;background:var(--ink);transition:all .15s}
.shutter.cine i{background:var(--red)}
.shutter.cine.recording i{width:1.8rem;height:1.8rem;border-radius:6px}
.shutter:disabled{opacity:.4}
.note{margin:.9rem 0 0;font-weight:600;background:var(--panel);border-left:6px solid var(--ink);padding:.55rem .75rem;border-radius:6px}
/* album */
.topbar{display:flex;align-items:center;gap:.6rem;margin:.6rem 0 .5rem}
.topbar h2{margin:0;font-size:1.2rem;flex:1}
.back{min-height:2.8rem;padding:0 .9rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);font-weight:800;display:flex;align-items:center;gap:.35rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.tile{position:relative;aspect-ratio:3/4;border:0;padding:0;border-radius:6px;overflow:hidden;background:#000 center/cover no-repeat}
.tile span{position:absolute;bottom:.3rem;background:rgba(0,0,0,.75);color:#fff;font-size:.85rem;font-weight:800;padding:.05rem .35rem;border-radius:4px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:.2rem}
.tile .e{left:.3rem}.tile .d{right:.3rem}
.empty{font-weight:600;background:var(--panel);padding:1rem;border-radius:8px}
.mediabox{display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;overflow:hidden}
.media{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.info{margin:.5rem 0!important}
.actions.row{grid-auto-flow:column;grid-auto-columns:1fr}
.actions.row .big{padding:0 .3rem;line-height:1.2}
.cardbox{display:flex;justify-content:center;margin:.5rem 0}
#cardPrev{display:block;width:100%;height:100%;object-fit:contain;margin:0!important}
.settings h2{margin:.45rem 0 .25rem!important}
.frames button{width:3.4rem!important}
details.more{margin-top:.6rem;background:var(--panel);border-left:6px solid var(--ink);border-radius:6px;padding:.1rem .75rem}
details.more summary{min-height:2.6rem;display:flex;align-items:center;font-weight:800;cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:'';margin-left:auto;width:.6rem;height:.6rem;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
details.more[open] summary::after{transform:rotate(-135deg)}
details.more p{margin:0 0 .6rem;font-weight:600}
.info{font-weight:700;margin:.6rem 0}
.actions{display:grid;gap:.5rem}
.big{min-height:3.3rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);font-weight:800;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:0 .8rem;text-align:center}
.big.primary{background:var(--ink);color:#fff}
.big.danger{border-color:var(--red);color:var(--red)}
/* card maker */
.settings{background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:.2rem .8rem .9rem}
.settings h2{margin-top:.7rem}
.frames{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem}
.frames button{flex:none;width:4.2rem;aspect-ratio:3/4;border:3px solid transparent;border-radius:6px;padding:0;background:#000 center/cover no-repeat;position:relative}
.frames button.on{border-color:var(--red)}
.frames button span{position:absolute;bottom:.15rem;left:.15rem;background:rgba(0,0,0,.75);color:#fff;font-size:.8rem;font-weight:800;padding:0 .25rem;border-radius:3px}
.txt{width:100%;min-height:3rem;border:2px solid var(--ink);border-radius:6px;padding:.4rem .6rem;background:#fff;font-weight:600}
.help{margin:.4rem 0 0;font-weight:600}

/* language picker */
#lang{position:fixed;inset:0;z-index:50;background:var(--black);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:2rem}
#lang.on{display:flex}
#lang .t{font-size:1.5rem;font-weight:800;text-align:center;line-height:1.35}
#lang button{width:min(18rem,80vw);min-height:3.6rem;border:0;border-radius:10px;background:#fff;color:var(--ink);font-size:1.25rem;font-weight:800}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 1rem);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:.7rem 1.1rem;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ver{margin-top:1rem;font-weight:600}
</style>
</head>

<main>
<!-- CAMERA -->
<section class="view fit on" id="vCam">
  <div class="vfwrap grow" id="vfwrap"><div class="vf" id="vf">
    <canvas id="out" width="720" height="960"></canvas>
    <video id="video" playsinline muted autoplay></video>
    <div class="recinfo" id="recinfo"><b>●</b> <span id="rectime">0:00</span> / 0:15</div>
    <div class="bar" id="bar"></div>
    <canvas class="hist" id="hist" width="128" height="48" hidden></canvas>
    <div class="vuwrap" id="vuWrap" hidden><i class="vu" id="vu"></i></div>
    <div class="flash" id="flash"></div>
    <svg class="gridov" id="gridOv" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" hidden></svg>
    <div class="level" id="levelOv" hidden><i class="lv-side l"></i><i class="lv-bar" id="lvBar"></i><i class="lv-side r"></i></div>
    <div class="cdov" id="cdOv" hidden><b id="cdNum"></b></div>
    <div class="vfwait" id="vfWait" hidden><span data-i="starting"></span></div>
    <div class="vfwait dev" id="vfDev" hidden><span data-i="developing"></span></div>
    <div class="startbox" id="startbox">
      <button id="startBtn"><svg width="26" height="26"><use href="#i-cam"/></svg><span data-i="start"></span></button>
      <p id="startMsg"></p>
    </div>
  </div>
  </div>

  <div class="ctlrow">
    <div class="lenses" id="lensbar" hidden></div>
    <button class="chip evchip" id="evChip" aria-label="EV"><svg id="evLockI" hidden width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg><span id="evChipT">±0</span></button>
    <div class="evedit" id="evctl" hidden>
      <button class="chip" id="evMinus" aria-label="EV −"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button id="evVal" class="chip evv" aria-label="EV reset"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg><span id="evVal_t"></span></button>
      <button class="chip" id="evPlus" aria-label="EV +"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button class="chip" id="evReset" aria-label="EV 0"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.2 3.8v4.6h4.6"/></g></svg></button>
      <button class="chip" id="evLock" aria-label="AE lock"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
      <button class="chip" id="evDone" aria-label="OK"><svg width="20" height="20"><use href="#i-check"/></svg></button>
    </div>
  </div>

  <div class="moderow">
    <div class="tabs"><button class="tab" id="mCine"><svg width="20" height="20"><use href="#i-cine"/></svg><span data-i="cine"></span></button><button class="tab" id="mStill"><svg width="20" height="20"><use href="#i-still"/></svg><span data-i="still"></span></button></div>
    <div class="cfgwrap"><button class="chip cfgchip" id="timerChip" aria-label="Timer"><svg width="24" height="24"><use href="#i-timer"/></svg><span id="timerT"></span></button></div>
  </div>

  <div class="shutterrow">
    <button class="albumbtn" id="albumBtn" aria-label="Album"><span class="cnt" id="albumCnt" hidden>0</span></button>
    <button class="shutter" id="shutter" aria-label="Shutter" disabled><i></i><b class="shlbl" id="shutLbl"></b></button>
    <button class="flipbtn" id="flipBtn" aria-label="Flip camera"><svg width="30" height="30"><use href="#i-flip"/></svg></button>
  </div>
  <p class="note" id="camNote" hidden></p>
</section>

<!-- ALBUM -->
<section class="view" id="vAlbum">
  <div class="topbar">
    <button class="back" data-go="vCam"><svg width="20" height="20"><use href="#i-back"/></svg><span data-i="back"></span></button>
    <h2 data-i="album"></h2>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" data-i="noItems" hidden></p>
  <p class="note" data-i="storageNote"></p>
  <p class="ver" id="ver"></p>
</section>

<!-- VIEWER -->
<section class="view fit" id="vView">
  <div class="topbar">
    <button class="back" data-go="vAlbum"><svg width="20" height="20"><use href="#i-back"/></svg><span data-i="back"></span></button>
    <h2 id="viewTitle"></h2>
  </div>
  <div class="mediabox grow" id="mediaBox"></div>
  <p class="info" id="viewInfo"></p>
  <div class="actions row">
    <button class="big primary" id="shareBtn" data-i="share"></button>
    <button class="big" id="cardBtn" data-i="makeCard"></button>
    <button class="big danger" id="delBtn" data-i="del"></button>
  </div>
</section>

<!-- CARD MAKER -->
<section class="view fit" id="vCard">
  <div class="topbar">
    <button class="back" data-go="vView"><svg width="20" height="20"><use href="#i-back"/></svg><span data-i="back"></span></button>
    <h2 data-i="makeCard"></h2>
  </div>
  <div class="settings">
    <div id="frameWrap">
      <h2 data-i="pickFrame"></h2>
      <div class="frames" id="frames"></div>
    </div>
    <h2 data-i="caption"></h2>
    <input class="txt" id="capIn" maxlength="40" autocomplete="off">
    <h2 data-i="qrLink"></h2>
    <input class="txt" id="qrIn" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="cardbox grow"><canvas id="cardPrev" width="950" height="1430"></canvas></div>
  <div class="actions row">
    <button class="big primary" id="shareCardBtn" data-i="shareCard"></button>
    <button class="big" id="printBtn" data-i="printImg"></button>
  </div>
  <details class="more"><summary data-i="howto"></summary><p data-i="qrHelp"></p><p data-i="printNote"></p></details>
</section>
</main>
<div class="qd" id="qd">
  <div class="qd-body" id="qdBody"><div class="qd-in" id="qdIn"></div><div class="qd-more"><button class="chip" id="eraSum" aria-expanded="false" aria-controls="eraPanel"><svg width="22" height="22"><use href="#i-gear"/></svg><span data-i="moreSet"></span></button></div></div>

</div>

  </div>
  <div class="cfgbody">
    <h2 data-i="textSize"></h2>
    <div class="seg fsopts" id="fsOpts">
      <button data-fs="1"><span style="font-size:1rem">Aa</span></button>
      <button data-fs="2"><span style="font-size:1.25rem">Aa</span></button>
      <button data-fs="3"><span style="font-size:1.5rem">Aa</span></button>
    </div>
    <h2 data-i="infoT"></h2>
    <p class="cfgdesc" id="resInfo"></p>
    <p class="cfgdesc warn" id="resWarn" hidden></p>
    <p class="cfgdesc warn" id="stWarn" hidden></p>
    <p class="cfgdesc warn" id="lvWarn" hidden></p>
    <h2 data-i="eraGuideT"></h2>
    <ol class="eraguide" id="eraGuide"></ol>
    <!-- Shooting settings live in the quick drawer; these are the drawer's source controls, kept out of sight. -->
    <div class="cfgsrc" style="display:none">
    <h2 data-i="language"></h2>
    <div class="seg langopts" id="langOpts">
      <button data-l="zh">简体</button>
      <button data-l="zht">繁體</button>
      <button data-l="en">English</button>
      <button data-l="ms">Malay</button>
    </div>
    <h2 data-i="era"></h2>
    <div class="seg eras" id="eras"></div>
    <p class="cfgdesc" id="cfgDesc"></p>
    <h2 data-i="degree"></h2>
    <div class="seg degs" id="degs"></div>
    <h2 data-i="shape"></h2>
    <div class="seg ratios" id="ratios"></div>
    <h2 data-i="fpsT"></h2>
    <div class="seg fpsopts" id="fpsOpts"></div>
    <p class="cfgdesc" id="fpsDesc"></p>
    <h2 data-i="quality"></h2>
    <div class="seg vqs" id="vqs"></div>
    <h2 data-i="shutT"></h2>
    <p class="sublabel" data-i="angleT"></p>
    <div class="seg shutopts" id="angleOpts"></div>
    <p class="cfgdesc" id="angleDesc"></p>
    <p class="sublabel" data-i="slowT"></p>
    <div class="seg shutopts5" id="slowOpts"></div>
    <p class="cfgdesc" data-i="slowD"></p>
    <div class="seg" id="wbOpts"></div>
    <div class="seg" id="aidOpts"></div>
    <h2 data-i="compose"></h2>
    <div class="seg grids" id="gridOpts"></div>
    <div class="seg lvrow"><button id="tLevel"><svg width="20" height="20" class="ic"><use href="#i-check"/></svg><span data-i="levelT"></span></button><button id="tStab"><svg width="20" height="20" class="ic"><use href="#i-check"/></svg><span data-i="stabT"></span></button></div>
    <p class="cfgdesc" id="stDesc" data-i="stabD" hidden></p>
    <div class="seg toggles">
      <button id="tFx"><svg width="20" height="20" class="ic"><use href="#i-check"/></svg><span data-i="frameFx"></span></button>
      <button id="tSnd"><svg width="20" height="20" class="ic"><use href="#i-check"/></svg><span data-i="soundFx"></span></button>
    </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// Resolution follows the camera. srcW×srcH = what the phone's camera actually delivers.
// Photo = the largest box of the chosen shape inside the camera frame (capped at 4096 px long side).
// Clip = short side from the quality tier (720p / 1080p), never larger than the camera frame. 2K/4K were dropped:
// a browser can't hold 24 fps at those sizes through the effects, and 15 s clips go out over WhatsApp anyway.
const VQ=[[720,'720p'],[1080,'1080p']];

const ratioR=()=>{const q=RATIOS.find(x=>x[0]===S.ratio)||RATIOS[0];return q[1]/q[2]};
const even=n=>Math.max(2,Math.round(n/2)*2);
const fitRatio=(w0,h0,r)=>w0/h0>r?[h0*r,h0]:[w0,w0/r];
const dimsFromShort=(q,r)=>r<1?[even(q),even(q/r)]:[even(q*r),even(q)];
// Feed sizing. 照片 always gets the full sensor feed (12 MP on iPhone). 短片 asks only for a feed big enough
// for the clip size — pushing 12 MP through the effects 24-30x a second just to throw most of it away was
// the main cost. Landscape request = smallest 4:3 frame that covers the clip in the chosen shape.
let camMaxW=0,camMaxH=0,feedReq='';
function feedWant(){
  if(S.mode==='still')return[4032,3024];
  const r=ratioR(),q=+S.vq===720?720:1080;
  const[w,h]=dimsFromShort(q,r);
  return[Math.max(1920,Math.ceil(Math.max(h,w*4/3))),Math.max(1440,Math.ceil(Math.max(w,h*3/4)))];
}

  const tms=performance.now(),iv=1000/((rec&&rec.state==='recording')?(S.fps||24):30);

  const w=$('vfWait');
  if(!camOn||starting||document.visibilityState!=='visible'||!$('vCam').classList.contains('on')){w.hidden=true;deadSince=0;return}
  if(video.paused)video.play().catch(()=>{});

  tr.setAttribute('aria-label',t(isEra?'era':'degree'));tr.setAttribute('aria-valuemin',btns[0].textContent);tr.setAttribute('aria-valuemax',btns[btns.length-1].textContent);

  const val=document.createElement('div');val.className='qval';

  const set=i=>{i=Math.max(0,Math.min(btns.length-1,i));show(i);if(i!==cur())btns[i].click()};
  const fromX=x=>{const r=tr.getBoundingClientRect(),pad=r.height/2;return Math.round((x-r.left-pad)/(r.width-2*pad)*(btns.length-1))};

// ---- 防抖 stabiliser (EIS): integrate the gyro, follow a smoothed path (deliberate pans), cancel the rest.
// Signs from the W3C device frame (x right, y up, z toward the viewer, right-hand rule): +gamma turns the
// back camera left, +beta tilts it up, +alpha rolls it counter-clockwise. Shifts are fractions of the camera
// feed, using each lens's field of view across the sensor's short side (portrait width) and long side.

  // Intended path follows the low-passed rotation SPEED (so a steady pan has no lag), plus a slow pull
  // toward the true angle. Fast tremor (several Hz) is left out of the path and gets cancelled.
  const kv=1-Math.exp(-dt/.25),kp=1-Math.exp(-dt/1.2);
